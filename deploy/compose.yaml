name: video-summary-app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_USER:?set PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:?set PG_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  object-store:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_ACCESS_KEY:?set OBJECT_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_SECRET_KEY:?set OBJECT_SECRET_KEY}
      RUSTFS_VOLUMES: /data
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  api:
    build:
      context: ../backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${PG_USER:?set PG_USER}:${PG_PASSWORD:?set PG_PASSWORD}@db:5432/${PG_DB:?set PG_DB}
      S3_ENDPOINT_URL: http://object-store:9000
      S3_ACCESS_KEY: ${OBJECT_ACCESS_KEY:?set OBJECT_ACCESS_KEY}
      S3_SECRET_KEY: ${OBJECT_SECRET_KEY:?set OBJECT_SECRET_KEY}
      S3_BUCKET: video-summary-private
      IMPORT_STAGING_DIR: /var/lib/video-summary-app/staging
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-5}
      IMPORT_UPLOAD_TIMEOUT_SECONDS: ${IMPORT_UPLOAD_TIMEOUT_SECONDS:-1800}
      IMPORT_DOWNLOAD_TIMEOUT_SECONDS: ${IMPORT_DOWNLOAD_TIMEOUT_SECONDS:-1800}
      MEDIA_PROBE_TIMEOUT_SECONDS: ${MEDIA_PROBE_TIMEOUT_SECONDS:-30}
      MEDIA_DECODE_TIMEOUT_SECONDS: ${MEDIA_DECODE_TIMEOUT_SECONDS:-3600}
      MODEL_CALLS_ENABLED: "false"
      QUEUE_GLOBAL_CONCURRENCY: ${QUEUE_GLOBAL_CONCURRENCY:-1}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_SHUTDOWN_SECONDS: ${WORKER_SHUTDOWN_SECONDS:-5}
      TASK_DB_TIMEOUT_SECONDS: ${TASK_DB_TIMEOUT_SECONDS:-5}
      AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8000,http://localhost:8000}
      AUTH_ACCOUNT_LIMIT: ${AUTH_ACCOUNT_LIMIT:-5}
      AUTH_SOURCE_LIMIT: ${AUTH_SOURCE_LIMIT:-20}
      AUTH_REGISTER_SOURCE_LIMIT: ${AUTH_REGISTER_SOURCE_LIMIT:-20}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-900}
      AUTH_BLOCK_SECONDS: ${AUTH_BLOCK_SECONDS:-900}
    volumes:
      - input-staging:/var/lib/video-summary-app/staging
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  worker:
    build:
      context: ../backend
      target: runtime
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://${PG_USER:?set PG_USER}:${PG_PASSWORD:?set PG_PASSWORD}@db:5432/${PG_DB:?set PG_DB}
      S3_ENDPOINT_URL: http://object-store:9000
      MODEL_CALLS_ENABLED: "false"
      QUEUE_GLOBAL_CONCURRENCY: ${QUEUE_GLOBAL_CONCURRENCY:-1}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_SHUTDOWN_SECONDS: ${WORKER_SHUTDOWN_SECONDS:-5}
      TASK_DB_TIMEOUT_SECONDS: ${TASK_DB_TIMEOUT_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

volumes:
  postgres-data:
  object-data:
  input-staging:

networks:
  private: {}
